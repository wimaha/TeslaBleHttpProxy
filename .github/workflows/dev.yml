name: Dev

env:
  GO_VERSION: ^1.26

# :dev is always the current state of main. The ruleset "Required checks" lets a change reach
# main only with Build, Lint and Test passing (admins can bypass), so every push is published.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push replaces a build still running, so an older commit never overwrites :dev.
concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  docker:
    name: Publish Docker :dev
    # also for a manual run: never publish another branch as :dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wimaha/tesla-ble-http-proxy
          tags: |
            type=raw,value=dev

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}

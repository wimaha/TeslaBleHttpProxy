name: Release

env:
  GO_VERSION: ^1.26

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  docs:
    name: Check docs for release
    # A manual run on a branch has no version to check against.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check README, docs and CHANGELOG
        run: ./scripts/check-release-docs.sh "${{ github.ref_name }}"

  docker:
    name: Publish Docker :release
    needs: docs
    # Publish only if the docs check passed, or did not run (manual run on a branch).
    if: ${{ !cancelled() && (needs.docs.result == 'success' || needs.docs.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wimaha/tesla-ble-http-proxy
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
